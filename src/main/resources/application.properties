quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/productdb
quarkus.datasource.username=postgres
quarkus.datasource.password=dbtest

#Used in the beginning to create/drop tables automatically
#quarkus.hibernate-orm.database.generation=drop-and-create
# After the first run, set to 'none' to avoid data loss
quarkus.hibernate-orm.database.generation=none

quarkus.hibernate-orm.log.sql=true
quarkus.http.port=9090
quarkus.log.console.level=INFO

quarkus.smallrye-openapi.info-title=Product Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API for managing products